name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PENSIEVE_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/pensieve_test
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: pensieve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pensieve_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pensieve-smoke .
      - name: Verify hosted container health
        run: |
          docker run --rm -d --name pensieve-smoke -p 18080:8080 \
            -e PORT=8080 \
            -e PENSIEVE_PUBLIC_URL=https://synthetic.example.com \
            -e PENSIEVE_OWNER_TOKEN=synthetic-ci-owner-token-not-a-real-secret \
            -e RESEND_API_KEY=synthetic-not-a-real-key \
            -e PENSIEVE_EMAIL_FROM=synthetic@example.com \
            pensieve-smoke
          trap 'docker stop pensieve-smoke >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs pensieve-smoke
          exit 1
      - name: Verify team service container health and connector metadata
        run: |
          docker run --rm -d --name pensieve-team-smoke -p 18081:8080 \
            -e PORT=8080 \
            -e PENSIEVE_PUBLIC_URL=https://synthetic.example.com \
            -e PENSIEVE_OWNER_TOKEN=synthetic-ci-owner-token-not-a-real-secret \
            pensieve-smoke node dist/cli.js team-server --home /data --host 0.0.0.0
          trap 'docker stop pensieve-team-smoke >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Host: synthetic.example.com' http://127.0.0.1:18081/health; then
              curl --fail --silent -H 'Host: synthetic.example.com' http://127.0.0.1:18081/.well-known/oauth-authorization-server
              exit $?
            fi
            sleep 1
          done
          docker logs pensieve-team-smoke
          exit 1
